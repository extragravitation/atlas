[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeg"
version = "0.0.0"
description = "Build and check pipeline for the Atlas of Extra Gravitation"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
data = ["astropy>=6.1", "numpy>=1.26"]

[tool.setuptools]
packages = ["aeg"]
