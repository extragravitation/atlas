name: data

# Fetches every data package's sources, verifies their hashes, rebuilds the
# tables and runs the package tests (including the frozen reproduction tests).
# Source files are never committed and never uploaded; they are fetched here.
#
# The committed tables must equal what the pipeline produces. On a pull
# request from this repository, if they differ, the regenerated tables are
# committed back to the branch by the workflow. On main, a difference fails.

on:
  pull_request:
    paths: ["data/**", "pipeline/**", ".github/workflows/data.yml"]
  push:
    branches: [main]
    paths: ["data/**", "pipeline/**", ".github/workflows/data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pipeline
        run: pip install -e "pipeline[test,data]"
      - name: Fetch and verify sources
        run: |
          set -uo pipefail
          for pkg in data/packages/*/*/; do
            [ -f "$pkg/sources.json" ] || continue
            if ! python -m aeg.fetch "$pkg" > fetch.log 2>&1; then
              echo "::error title=fetch $pkg::$(tail -c 3000 fetch.log | tr '\n' '|')"; exit 1
            fi
            cat fetch.log
          done
      - name: Build packages
        run: |
          set -uo pipefail
          for pkg in data/packages/*/*/; do
            [ -f "$pkg/convert.py" ] || continue
            if ! python "$pkg/convert.py" > build.log 2>&1; then
              echo "::error title=build $pkg::$(tail -c 3000 build.log | tr '\n' '|')"; exit 1
            fi
            cat build.log
          done
      - name: Package tests
        run: |
          set -uo pipefail
          status=0
          for pkg in data/packages/*/*/; do
            ls "$pkg"/tests/test_*.py >/dev/null 2>&1 || continue
            if ! pytest "$pkg/tests" -q -rA --tb=short > test.log 2>&1; then
              echo "::error title=tests $pkg::$(tail -c 3500 test.log | tr '\n' '|')"; status=1
            else
              echo "::notice title=tests $pkg::$(tail -c 1500 test.log | tr '\n' '|')"
            fi
            cat test.log
          done
          exit $status
      - name: Slider formulas (Python and JavaScript agree; identity at defaults)
        run: |
          set -uo pipefail
          if ! python -m aeg.formula_check > formula.log 2>&1; then
            echo "::error title=formula check::$(tail -c 3000 formula.log | tr '\n' '|')"; cat formula.log; exit 1
          fi
          echo "::notice title=formula check::$(head -c 1500 formula.log | tr '\n' '|')"
          cat formula.log
      - name: Committed tables equal regenerated tables
        if: always()
        run: |
          set -uo pipefail
          git add -A data/packages/*/*/tables data/packages/*/*/datapackage.json data/packages/*/*/checksums.sha256 data/registry 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice title=tables::committed tables match the pipeline output"; exit 0
          fi
          echo "::warning title=tables::$(git diff --cached --stat | tail -n 20 | tr '\n' '|')"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Regenerate tables from verified sources (data workflow)"
            git push -q origin "HEAD:${{ github.head_ref }}"
            echo "::notice title=tables::regenerated tables committed to ${{ github.head_ref }}"
          else
            echo "::error title=tables::committed tables differ from the pipeline output"; exit 1
          fi
