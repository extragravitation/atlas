name: data

# Fetches every data package's sources, verifies their hashes, rebuilds the
# tables and runs the package tests (including the frozen reproduction tests).
# Source files are never committed and never uploaded; they are fetched here.
#
# The committed tables must equal what the pipeline produces; a difference
# fails the check. The workflow never commits: every change in the repository
# is authored by the maintainer (converters are bit-deterministic, so tables
# regenerated locally match CI).

on:
  # Every pull request: "packages" is a required check, and a path filter would leave
  # documentation-only pull requests waiting for it forever.
  pull_request:
  push:
    branches: [main]
    paths: ["data/**", "pipeline/**", ".github/workflows/data.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pipeline
        run: pip install -e "pipeline[test,data]"
      # Source files already fetched by an earlier run are restored from the Actions cache, so
      # one slow or down server does not block every pull request. The cache is only a copy:
      # aeg.fetch checks every restored file against its hash in sources.json and re-fetches
      # any that do not match. The cache is private to the repository's Actions and never published.
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: data/packages/*/*/source
          key: sources-${{ hashFiles('data/packages/*/*/sources.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sources-${{ hashFiles('data/packages/*/*/sources.json') }}-
            sources-
      - name: Fetch and verify sources
        id: fetch
        run: |
          set -uo pipefail
          status=0
          for pkg in data/packages/*/*/; do
            [ -f "$pkg/sources.json" ] || continue
            if ! python -m aeg.fetch "$pkg" > fetch.log 2>&1; then
              echo "::error title=fetch $pkg::$(tail -c 3000 fetch.log | tr '\n' '|')"; status=1
            fi
            cat fetch.log
          done
          exit $status
      - name: Save source cache
        # Saved after every run, even when a server was down, so the files that were verified are
        # kept and the next run fetches only what is still missing. Every file in the cache was
        # hash-verified by aeg.fetch (an unverified download is deleted), and is re-verified on restore.
        if: always() && steps.fetch.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data/packages/*/*/source
          key: sources-${{ hashFiles('data/packages/*/*/sources.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build packages
        run: |
          set -uo pipefail
          for pkg in data/packages/*/*/; do
            [ -f "$pkg/convert.py" ] || continue
            if ! python "$pkg/convert.py" > build.log 2>&1; then
              echo "::error title=build $pkg::$(tail -c 3000 build.log | tr '\n' '|')"; exit 1
            fi
            cat build.log
          done
      - name: Package tests
        run: |
          set -uo pipefail
          status=0
          for pkg in data/packages/*/*/; do
            ls "$pkg"/tests/test_*.py >/dev/null 2>&1 || continue
            if ! pytest "$pkg/tests" -q -rA --tb=short > test.log 2>&1; then
              echo "::error title=tests $pkg::$(tail -c 3500 test.log | tr '\n' '|')"; status=1
            else
              echo "::notice title=tests $pkg::$(tail -c 1500 test.log | tr '\n' '|')"
            fi
            cat test.log
          done
          exit $status
      - name: Slider formulas (Python and JavaScript agree; identity at defaults)
        run: |
          set -uo pipefail
          if ! python -m aeg.formula_check > formula.log 2>&1; then
            echo "::error title=formula check::$(tail -c 3000 formula.log | tr '\n' '|')"; cat formula.log; exit 1
          fi
          echo "::notice title=formula check::$(head -c 1500 formula.log | tr '\n' '|')"
          cat formula.log
      - name: Committed tables equal regenerated tables
        if: always()
        run: |
          set -uo pipefail
          git add -A data/packages/*/*/tables data/packages/*/*/datapackage.json data/packages/*/*/checksums.sha256 data/registry 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice title=tables::committed tables match the pipeline output"; exit 0
          fi
          # No automatic commits: every change in the repository is authored by the maintainer.
          # Regenerate locally (python <package>/convert.py) and commit the result in the pull request.
          echo "::error title=tables::committed tables differ from the pipeline output: $(git diff --cached --stat | tail -n 20 | tr '\n' '|')"
          exit 1
