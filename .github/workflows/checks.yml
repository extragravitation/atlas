name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04  # same image as data.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pipeline
        run: pip install -e "pipeline[test,data]"
      - name: Unit tests
        run: pytest pipeline/tests -q
      - name: Repository checks
        run: python -m aeg.check
      - name: Standard validation (every package, against the version it states)
        run: |
          set -uo pipefail
          status=0
          for pkg in data/packages/*/*/; do
            python -m aeg.validate "$pkg" || { echo "::error title=standard $pkg::validation failed"; status=1; }
          done
          exit $status
      - name: Re-issue test T1 to T6 (every dataset with v2 and v3; D-114)
        run: python -m aeg.reissue_check --all
      - name: Install site
        working-directory: site
        run: npm ci
      - name: Site unit tests
        working-directory: site
        run: npm test
      - name: Build site
        working-directory: site
        env:
          AEG_OFFLINE: "1"
        run: npm run build
      - name: Site checks (values against the packages, downloads, links, reading layers)
        run: python -m aeg.site_check site/dist
