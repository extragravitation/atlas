<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Atlas of Extra Gravitation</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #0b0f14; --fg: #e8edf2; --muted: #a9b4bf; --link: #7fd4ff; --rule: #243040; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fbfbf8; --fg: #14181d; --muted: #4a5561; --link: #0b5f8a; --rule: #d9dde2; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 18vh 16px 4rem; }
  h1 { font-size: clamp(1.9rem, 6vw, 2.8rem); line-height: 1.15; margin: 0 0 .4rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 1.1rem; margin: 0 0 2rem; }
  p { margin: 0 0 1rem; }
  .status { border-top: 1px solid var(--rule); padding-top: 1.25rem; margin-top: 2rem; color: var(--muted); font-size: .95rem; }
  a { color: var(--link); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p class="sub">There is nothing at this address.</p>
  <p>The Atlas is in preparation, so most addresses do not exist yet. Once published, addresses are permanent.</p>
  <p class="status"><a href="/">Atlas of Extra Gravitation home</a></p>
</main>
</body>
</html>
